<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up</title>
<script src="maham.config.js"></script>
<style>
  :root { --bg: #f5f7fa; --card: #fff; --ink: #1d2433; --muted: #667085; --line: #e3e8ef; --accent: #0e7c86; --bad: #c0392b; --good: #1e8e5a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f141b; --card: #171e28; --ink: #e6ebf2; --muted: #98a2b3; --line: #2a3442; --accent: #2bb3bd; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 60px; }
  h1 { font-size: 26px; margin: 4px 0 8px; } .muted { color: var(--muted); } .small { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 16px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 14px; }
  input, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; }
  textarea { min-height: 80px; }
  button { margin-top: 14px; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button[disabled] { opacity: .6; }
  .msg { padding: 10px 12px; border-radius: 8px; margin-top: 12px; } .msg.bad { background: #fdecea; color: var(--bad); } .msg.good { background: #e8f6ef; color: var(--good); }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
/* MAHAM — a campaign's public sign-up form: form.html?c=<company id>&f=<campaign id>. Each sign-up becomes a contact and
 * a follow-up for the campaign's owner (database functions form_info / form_submit, supabase/schema.sql). */
(() => {
  const cfg = (window.MAHAM_CONFIG || {}).cloud || {}; const app = document.getElementById('app'); const qs = new URLSearchParams(location.search);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rpc = async (fn, args) => { const r = await fetch(cfg.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: cfg.anonKey, 'Content-Type': 'application/json' }, body: JSON.stringify(args) }); const j = await r.json().catch(() => null); if (!r.ok) throw new Error((j && (j.message || j.msg)) || 'Something went wrong'); return j; };
  const c = qs.get('c') || cfg.company, f = qs.get('f');
  if (!cfg.url || !cfg.anonKey || !c || !f) { app.innerHTML = '<h1>Sign up</h1><p class="muted">This form is not available.</p>'; return; }
  rpc('form_info', { c, p_form: f }).then(info => {
    if (!info) { app.innerHTML = '<h1>Sign up</h1><p class="muted">This form is closed.</p>'; return; }
    document.title = info.title;
    app.innerHTML = `<p class="muted small">${esc(info.company)}</p><h1>${esc(info.title)}</h1>${info.intro ? `<p>${esc(info.intro)}</p>` : ''}
      <div class="card"><label for="n">Your name</label><input id="n" maxlength="100" autocomplete="name"><label for="e">Email</label><input id="e" type="email" maxlength="200" autocomplete="email">
      <label for="p">Phone (optional)</label><input id="p" maxlength="40" autocomplete="tel"><label for="t">Anything to add (optional)</label><textarea id="t" maxlength="2000"></textarea>
      <button id="go">Sign up</button><div id="m"></div></div>`;
    document.getElementById('go').onclick = async e => {
      const v = id => document.getElementById(id).value.trim();
      e.target.disabled = true;
      try { await rpc('form_submit', { c, p_form: f, p_name: v('n'), p_email: v('e'), p_phone: v('p'), p_note: v('t') }); app.querySelector('.card').innerHTML = '<div class="msg good">Thank you — you are signed up. We will be in touch.</div>'; }
      catch (er) { e.target.disabled = false; document.getElementById('m').innerHTML = `<div class="msg bad">${esc(er.message)}</div>`; }
    };
  }).catch(() => { app.innerHTML = '<h1>Sign up</h1><p class="muted">This form is not available right now.</p>'; });
})();
</script>
</body>
</html>
