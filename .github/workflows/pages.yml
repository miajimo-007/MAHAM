name: Publish to GitHub Pages

# Builds the app and publishes it at https://<owner>.github.io/<repo>/ on every push to main.
# One-time setup in the repository: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build.py
      - name: Site folder (the built app + the Pages settings + a start page)
        run: |
          mkdir -p _site
          cp -r dist/MAHAM/. _site/
          cp pages/maham.config.js _site/maham.config.js
          cp pages/index.html _site/index.html
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
