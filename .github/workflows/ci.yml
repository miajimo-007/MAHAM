name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04 # a system the pinned Playwright supports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 openpyxl # the version the tests are written and checked with
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: npm run build:lab
      - run: npm run test:lab
